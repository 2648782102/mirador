# Builds the prebuilt Linux archives of a release tag and attaches them to a DRAFT GitHub release. It never
# publishes: a maintainer reviews the draft and publishes it by hand, and a promotion PR to main then pins
# the version and its checksums in scripts/bootstrap.sh (docs/releasing.md has the steps).
#   git tag v0.2.0 && git push origin v0.2.0
#   or Actions > release > Run workflow, from the tag, with the same tag as input
# build makes one archive per architecture on a GitHub-hosted runner of that architecture (no cross-compiling):
# the official Node 24 binary, checked against nodejs.org's SHASUMS256.txt; Mirador's TypeScript sources as
# they are; and production node_modules with node-pty built inside a glibc 2.28 container (BUILD_IMAGE), so
# the archive runs on any Linux with glibc 2.28 or newer, Node 24's own minimum (scripts/release/).
# publish waits behind the `release` environment, whose required reviewer approves each run, then writes
# SHA256SUMS, attests every archive's build provenance and creates the draft release.
# Permissions: none by default; build reads the repository; only publish can write releases and attestations.
# Every action is pinned to a commit SHA with its release tag in a trailing comment, as in test.yml; no run
# step expands an expression, so a tag name reaches the shell only as an environment variable.
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'The release tag to build, such as v0.2.0; run the workflow from that same tag'
        type: string
        required: true

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  # The Node bundled in every archive. A Node security release means a Mirador release with this bumped.
  NODE_VERSION: 24.22.3
  # AlmaLinux 8 ships glibc 2.28.
  BUILD_IMAGE: almalinux:8@sha256:768bedc30fe0a536adb0a65d2eddb7caad364e514fbddd0ae9e026975f590342

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check the tag
        run: |
          if [ "$GITHUB_REF" != "refs/tags/$TAG" ]; then
            echo "release: run this workflow from the tag $TAG (it ran from $GITHUB_REF)" >&2
            exit 1
          fi
          version="$(sh scripts/release/check-tag.sh "$TAG" package.json)"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Fetch the official Node and check it against SHASUMS256.txt
        run: sh scripts/release/fetch-node.sh "$NODE_VERSION" "$ARCH" "$RUNNER_TEMP/node"
      - name: Build the archive
        run: sh scripts/release/build-linux.sh "$VERSION" "$ARCH" "$RUNNER_TEMP/node/node-v$NODE_VERSION-linux-$ARCH" "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mirador-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/dist/mirador-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mirador-linux-*
          merge-multiple: true
          path: dist
      - name: Write SHA256SUMS
        run: |
          version="${TAG#v}"
          for arch in x64 arm64; do
            test -f "dist/mirador-$version-linux-$arch.tar.gz"
          done
          cd dist
          sha256sum mirador-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/mirador-*.tar.gz'
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${TAG#v}"
          {
            echo "Draft built by the release workflow from $TAG ($GITHUB_SHA). Review it before publishing it (docs/releasing.md)."
            echo
            echo "SHA256SUMS:"
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
            echo
            echo "Each archive has a build-provenance attestation: gh attestation verify <archive> -R $GITHUB_REPOSITORY"
            echo
            echo "Once published, the promotion PR to main puts these lines in place of the pins in scripts/bootstrap.sh:"
            echo
            echo '```sh'
            sh scripts/release/pins.sh "$version" dist/SHA256SUMS
            echo '```'
          } > notes.md
          gh release create "$TAG" --draft --verify-tag --title "Mirador $TAG" --notes-file notes.md dist/mirador-*.tar.gz dist/SHA256SUMS
